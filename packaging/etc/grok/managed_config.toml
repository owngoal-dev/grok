# OwnGoal Studio defaults for jailbroken iOS.
# This is the system managed-config layer (RootHide's `.jbroot/etc/grok/managed_config.toml`
# or rootless `/var/jb/etc/grok/managed_config.toml`). User `$GROK_HOME/config.toml`
# overrides it. Local `$GROK_HOME` skills remain usable.

# Desktop vendor skill trees are not required for grok as a coding agent on
# iOS and default-watching them adds open-file load.
[compat.claude]
skills = false

[compat.cursor]
skills = false

# Desktop platform bundles (Office, game-asset, resume-from-other-agents) are
# not provided on a jailbroken iOS coding-agent install. Keep them ignored if
# grok re-extracts the bundled cache.
[skills]
ignore = [
  "~/.grok/bundled/skills/pptx",
  "~/.grok/bundled/skills/pdf",
  "~/.grok/bundled/skills/docx",
  "~/.grok/bundled/skills/game-animation-frames",
  "~/.grok/bundled/skills/game-asset-core",
  "~/.grok/bundled/skills/game-character-consistency",
  "~/.grok/bundled/skills/game-tilesets",
  "~/.grok/bundled/skills/game-ui-icons",
  "~/.grok/bundled/skills/resume-claude",
  "~/.grok/bundled/skills/resume-cursor",
]
disabled = [
  "pptx",
  "pdf",
  "docx",
  "game-animation-frames",
  "game-asset-core",
  "game-character-consistency",
  "game-tilesets",
  "game-ui-icons",
  "resume-claude",
  "resume-cursor",
]
